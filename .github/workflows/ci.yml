name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - name: Check out source and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby and dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Scan, lint, test, build and verify installed gem
        run: script/ci
      - name: Verify PostgreSQL inventory against a temporary database
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '4.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bundle exec rake test:postgres
      - name: Upload coverage and dependency measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-ruby-${{ matrix.ruby }}
          path: tmp/coverage/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified gem
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '4.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-connector-${{ github.sha }}
          path: tmp/ci/*.gem
          if-no-files-found: error
          retention-days: 14

  minimum-dependencies:
    name: Minimum dependencies / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
    env:
      BUNDLE_GEMFILE: gemfiles/minimum.gemfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby and minimum business dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test and verify installed gem
        run: bundle exec rake test package:verify
      - name: Upload minimum dependency measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-minimum-ruby-${{ matrix.ruby }}
          path: tmp/coverage/summary.json
          if-no-files-found: error
          retention-days: 14

  json3-source-compatibility:
    name: JSON 3 / explicit textfsm metadata patch / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
    env:
      BUNDLE_GEMFILE: gemfiles/json3.gemfile
    steps:
      - name: Check out connector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out fixed TextFSM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gatework/textfsm
          ref: 733340de378f2d7fbe530b48f2cf1dd6c30c69b0
          path: tmp/json3/textfsm
          persist-credentials: false
      - name: Apply the explicit unpublished dependency declaration
        run: git -C tmp/json3/textfsm apply "$GITHUB_WORKSPACE/script/compatibility/textfsm-json3.patch"
      - name: Set up Ruby and JSON 3
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Verify source behavior and patched-package installation
        run: |
          bundle exec rake test
          bundle exec ruby script/verify_json3.rb
