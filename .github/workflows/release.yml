name: Release

# 标签触发可信发布；手动选择同一标签可恢复失败的原包发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate version and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - name: Check tag and archived changelog
        run: |
          version="$(ruby -Ilib -rnet/connector/version -e 'print Net::Connector::VERSION')"
          test "$GITHUB_REF" = "refs/tags/v${version}"
          ruby -r ./script/release -e 'Release.release_notes(File.read("CHANGELOG.md"), Net::Connector::VERSION)'

  verify:
    name: Verify release on all supported environments
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the verified artifact
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: net-connector-${{ github.sha }}
          path: tmp/ci
      - name: Configure RubyGems Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Recheck secrets and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(ruby -Ilib -rnet/connector/version -e 'print Net::Connector::VERSION')"
          ruby script/release.rb --artifact "tmp/ci/net-connector-${version}.gem"
