name: Release

# 手动在版本标签上运行，避免本地发布创建标签时触发第二次上传。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate version and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - name: Check tag and archived changelog
        run: |
          version="$(ruby -Ilib -rnet/connector/version -e 'print Net::Connector::VERSION')"
          test "$GITHUB_REF" = "refs/tags/v${version}"
          ruby -r ./script/release -e 'Release.release_notes(File.read("CHANGELOG.md"), Net::Connector::VERSION)'

  verify:
    name: Verify release on all supported environments
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the verified artifact
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: net-connector-${{ github.sha }}
          path: tmp/ci
      - name: Recheck secrets and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          version="$(ruby -Ilib -rnet/connector/version -e 'print Net::Connector::VERSION')"
          ruby script/release.rb --artifact "tmp/ci/net-connector-${version}.gem"
