AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  DisabledByDefault: true
  Include:
    - lib/**/*.rb
    - exe/*
    - examples/**/*.rb
    - test/**/*.rb
    - script/**/*.rb
    - "*.gemspec"
    - Gemfile
    - gemfiles/*.gemfile
    - Rakefile
  Exclude:
    - tmp/**/*
    - pkg/**/*
    - vendor/**/*
    - examples/backups/**/*
    - .bundle/**/*

Lint:
  Enabled: true

Security:
  Enabled: true

Naming:
  Enabled: true

# 异常变量按角色命名（error、exception、original），不强制缩写为 e。
Naming/RescuedExceptionsVariableName:
  Enabled: false

# 保留已发布的 require "net-connector" 入口。
Naming/FileName:
  Exclude:
    - lib/net-connector.rb

Style/GuardClause:
  Enabled: true

Style/SafeNavigation:
  Enabled: true

Style/RedundantSelf:
  Enabled: true

Style/RedundantReturn:
  Enabled: true

Style/ExplicitBlockArgument:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

Style/MapToHash:
  Enabled: true

Style/Next:
  Enabled: true

Lint/EmptyBlock:
  Exclude:
    - test/**/*.rb

Layout/TrailingWhitespace:
  Enabled: true

Layout/TrailingEmptyLines:
  Enabled: true

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true

# 先约束会话引擎和批量编排，避免复杂控制流继续增长。
# 不生成按文件排除的基线；超限方法按职责拆分。
Metrics/MethodLength:
  Enabled: true
  Max: 40
  Include:
    - lib/net/connector/engine/**/*.rb
    - lib/net/connector/netdisco/**/*.rb

Metrics/AbcSize:
  Enabled: true
  Max: 60
  Include:
    - lib/net/connector/engine/**/*.rb
    - lib/net/connector/netdisco/**/*.rb

Layout/EmptyLineBetweenDefs:
  Enabled: true

Layout/IndentationConsistency:
  Enabled: true
