# net-connector import boundaries (STANDARD.md ARC-1), enforced by archcheck.
# Layers, bottom up: transport → terminal → driver → vendors → connector.
# Business workflows (backup, topology, deployment) belong in netops or the
# tools, never here.
declared:
  - .
  - ./transport
  - ./transport/ssh
  - ./transport/telnet
  - ./terminal
  - ./driver
  - ./vendors
  - ./vendors/centec
  - ./vendors/cisco
  - ./vendors/fortinet
  - ./vendors/h3c
  - ./vendors/hillstone
  - ./vendors/huawei
  - ./vendors/juniper
  - ./vendors/paloalto
  - ./vendors/radware
  - ./vendors/topsec
  - ./vendors/internal/family
  - ./connector
  - ./connectortest

rules:
  - name: root documents the module only
    packages: [.]
    deny: [./...]

  - name: net-connector never imports a consumer or a retired module
    packages: [./...]
    deny: [github.com/gatework/fabric/..., github.com/gatework/wireless/..., github.com/gatework/firemon/...,
           github.com/gatework/go-vxlan/..., github.com/gatework/go-netops/..., github.com/gatework/parser/...,
           github.com/gatework/go-expect/...]
    transitive: true

  - name: transport moves bytes only
    packages: [./transport, ./transport/...]
    deny: [./terminal, ./driver, ./vendors, ./vendors/..., ./connector, github.com/gatework/expect/...]

  - name: terminal knows grammars, not platforms
    packages: [./terminal]
    deny: [./transport, ./transport/..., ./driver, ./vendors, ./vendors/..., ./connector, ./connectortest]

  - name: driver defines the platform contract only
    packages: [./driver]
    only_local: [./terminal]

  - name: vendor families depend on the contract, not on each other
    packages: [./vendors/centec, ./vendors/cisco, ./vendors/fortinet, ./vendors/h3c, ./vendors/hillstone,
               ./vendors/huawei, ./vendors/juniper, ./vendors/paloalto, ./vendors/radware, ./vendors/topsec]
    only_local: [./driver, ./terminal, ./vendors/internal/family]

  - name: connector does not select vendors
    packages: [./connector]
    deny: [./vendors, ./vendors/..., ./transport/ssh, ./transport/telnet, ./connectortest]

  - name: netops reaches devices only through connector
    packages: [./transport, ./transport/..., ./terminal, ./driver, ./vendors, ./vendors/...]
    deny: [github.com/gatework/netops/ops, github.com/gatework/netops/apply, github.com/gatework/netops/store,
           github.com/gatework/netops/store/archive, github.com/gatework/netops/store/journal, github.com/gatework/netops/store/snapshot]
