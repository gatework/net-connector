# 仅保存非敏感策略，凭据使用环境变量。
# ND_URL、ND_CACHE_TTL、NC_CONCURRENCY 可覆盖对应策略；其余由 YAML 或 CLI 设置。
backup:
  directory: ./examples/backups
  concurrency: 4
  # limit_per_vendor: 3 # 省略时使用全量清单。
netdisco:
  source: http
  page_size: 500
  max_pages: 10000
  max_response_bytes: 16777216
  max_inventory_bytes: 134217728
  max_devices: 100000
  inventory_timeout: 300
  allow_insecure_http: false
inventory:
  include_hosts: []
  exclude_hosts: []
  include_vendors: []
  vendor_overrides: {}
  host_overrides: {}
  device_rules: []
  # device_rules:
  #   - vendor: Cisco
  #     model_prefix: N9K
  #     connector: cisco_nxos
ssh:
  protocol: ssh
  vendor_protocols: {}
  host_key_policy: accept_new # 保存首次见到的密钥，拒绝已有密钥变化。
  log_level: info
  max_script_output_bytes: null
tftp:
  vrfs:
    cisco_nxos: management
    hillstone: mgt-vr
