# 数据库身份从 ND_DB_HOST/NAME/USER/PASS 读取；非敏感连接策略在此设置。
netdisco:
  source: postgres
  db_port: 5432
  db_sslmode: verify-full
  # db_sslrootcert: /etc/net-connector/database-ca.crt
  # db_connect_timeout: 10
  query: |
    SELECT host(ip) AS ip, name, dns, vendor, os, model, os_ver, serial
    FROM device
    WHERE vendor = $1
    ORDER BY ip
  query_params: [H3C]
  page_size: 500
  max_devices: 100000
  inventory_timeout: 300

backup:
  directory: ./backups
  concurrency: 4
